<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algebrai Átalakítások Gyakorló</title>

    <!-- MathJax CDN a matematikai képletek szép megjelenítéséhez -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        /* Főmenü stílusa */
        .main-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }

        .main-menu a {
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .main-menu a:hover {
            background-color: #e2e6ea;
            color: #007bff;
        }

        .main-menu a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }

        select,
        button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }

        .task-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            padding: 15px 12px;
            border-radius: 6px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
        }

        .task-main {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Szépen formázott feladat címke doboz */
        .task-label-box {
            font-size: 20px;
            text-align: center;
            background: #fff;
            padding: 15px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .solution-btn {
            background-color: #17a2b8;
            font-weight: bold;
        }

        .solution-btn:hover {
            background-color: #138496;
        }

        .solution-box {
            margin-top: 10px;
            padding: 12px;
            background-color: #fff;
            border: 1px dashed #28a745;
            border-radius: 4px;
            font-size: 16px;
            font-family: monospace;
            overflow-x: auto;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Főmenü -->
        <div id="main-menu-container"></div>

        <h2>Algebrai Átalakítások Gyakorló</h2>

        <label for="category">Válassz szintet:</label>
        <select id="category" onchange="generateNewTask()">
            <option value="part0">0. Szint - Egyszerű (Zárójel nélküli, többváltozós, 5+ tag)</option>
            <option value="part1">1. Szint - Alap (Zárójelbontás és egyneműek)</option>
            <option value="part2">2. Szint - Egyismeretlenes (Középfokú)</option>
            <option value="part3">3. Szint - Kétismeretlenes (Haladó)</option>
        </select>

        <button id="start-btn" onclick="generateNewTask()">Új feladat</button>

        <div id="questions-container" style="display:none; margin-top: 20px;">
            <div id="tasks-list"></div>
        </div>
    </div>

                { id: "2r", expr: "8(-9x+20)+10x(7x-18)", step: "= -72x + 160 + 70x^2 - 180x", answer: "70x^2 - 252x + 160" },

        let currentTask = null;
        let timerInterval = null;

        function generateNewTask() {
            // Megállítjuk az esetlegesen futó előző időzítőt
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            const category = document.getElementById('category').value;
            const tasks = taskData[category];
            currentTask = tasks[Math.floor(Math.random() * tasks.length)];

            const container = document.getElementById('tasks-list');
            container.innerHTML = `
                <div class="task-row" id="single-task-row">
                    <div class="task-main">
                        <!-- Szépen formázott, renderelt feladat -->
                        <div class="task-label-box" id="task-expr-box">\\(${currentTask.expr}\\)</div>
                        
                        <!-- Mutasd a megoldást gomb -->
                        <button id="show-sol-btn" class="solution-btn" onclick="startCountdown()">Mutasd a megoldást</button>
                    </div>

                    <!-- Megoldás doboz (kezdetben rejtve) -->
                    <div id="solution-box" class="solution-box" style="display:none;">
                        <div><strong>Kibontás:</strong> \\(${currentTask.step}\\)</div>
                        <div><strong>Végeredmény:</strong> \\(${currentTask.answer}\\)</div>
                    </div>
                </div>
            `;

            document.getElementById('questions-container').style.display = 'block';

            if (window.MathJax) {
                MathJax.typesetPromise();
            }
        }

        function startCountdown() {
            const btn = document.getElementById('show-sol-btn');
            const solBox = document.getElementById('solution-box');

            btn.disabled = true;
            let timeLeft = 30;
            btn.innerText = `Megoldás megjelenítése: ${timeLeft}s`;

            timerInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    btn.innerText = `Megoldás megjelenítése: ${timeLeft}s`;
                } else {
                    clearInterval(timerInterval);
                    btn.innerText = "Megoldás megjelenítve!";
                    solBox.style.display = 'block';
                    if (window.MathJax) {
                        MathJax.typesetPromise([solBox]);
                    }
                }
            }, 1000);
        }

        window.onload = function () {
            generateNewTask();
        };
    </script>
    <script src="../js/menu.js"></script>
</body>

</html>
