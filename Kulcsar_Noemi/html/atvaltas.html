<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mértékegység Átváltás Gyakorló</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }
        /* Főmenü stílusa */
        .main-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }
        .main-menu a {
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .main-menu a:hover {
            background-color: #e2e6ea;
            color: #007bff;
        }
        .main-menu a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        h2 {
            text-align: center;
            margin-top: 0;
        }
        select, button {
            padding: 10px;
            margin: 10px 0;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        /* Nagyobb méret és láthatóság a hatványjeleknél */
        sup {
            font-size: 14px;
            font-weight: bold;
        }
        .reference-box {
            background-color: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin: 15px 0;
            font-size: 15px;
            color: #333;
            border: 1px solid #ced4da;
        }
        .reference-box strong {
            display: block;
            margin-bottom: 5px;
            color: #495057;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .task-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .task-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .task-label {
            font-size: 18px; /* Nagyobb betűméret a jobb olvashatóságért */
            font-weight: bold;
            flex: 1;
            white-space: nowrap;
        }
        .task-input {
            width: 140px;
            padding: 8px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: right;
        }
        .task-row.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .task-row.incorrect {
            background-color: #f8d7da;
            border-color: #f5c6cb;
        }
        .solution-text {
            color: #721c24;
            font-size: 14px;
            font-weight: bold;
            margin-top: 5px;
        }
        #submit-btn {
            background-color: #28a745;
            margin-top: 15px;
        }
        #submit-btn:hover {
            background-color: #218838;
        }
        #result-summary {
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Főmenü -->
        <div class="main-menu">
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/sikidomok.html">Síkidomok</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/atvaltas.html">Mértékegység átváltás</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/tortek.html">Törtek</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/kviz.html" class="active">Elméleti Kvíz</a>
        </div>

        <h2>Mértékegység Gyakorló</h2>
        <label for="category">Válassz kategóriát:</label>
        <select id="category">
            <option value="length">Hosszúság</option>
            <option value="area">Terület</option>
            <option value="volume">Térfogat</option>
            <option value="mass">Tömeg</option>
            <option value="capacity">Űrtartalom</option>
        </select>
        
        <div id="reference-container" class="reference-box"></div>

        <button id="start-btn">Új 10 feladat</button>
        
        <div id="questions-container" style="display:none; margin-top: 20px;">
            <div id="tasks-list"></div>
            <button id="submit-btn">Ellenőrzés</button>
        </div>
        
        <p id="result-summary"></p>
    </div>

    <script src="../js/atvaltas.js"></script>
</body>
</html>
