<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Egyenletmegoldó Gyakorló - Teljes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 750px;
            text-align: center;
        }
        .main-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }
        .main-menu a {
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        .equation-box {
            font-size: 22px;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        /* Szép, nagy törtvonalas CSS stílus */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            margin: 0 4px;
            font-size: 20px;
        }
        .numerator {
            border-bottom: 2px solid #333;
            padding-bottom: 2px;
        }
        .denominator {
            padding-top: 2px;
        }

        .input-container {
            margin-bottom: 15px;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 18px;
            width: 160px;
            text-align: center;
            border: 1px solid #ced4da;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        #checkBtn { background-color: #28a745; color: white; }
        #nextBtn { background-color: #007bff; color: white; display: none; }
        .result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
        
        .solution-steps {
            text-align: left;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 15px;
            display: none;
        }
        .solution-steps h4 {
            margin-top: 0;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Főmenü konténer -->
        <div id="main-menu-container"></div>

        <h2>Egyenletmegoldó Gyakorló</h2>

        <div style="margin-bottom: 15px;">
            <label>Nehézségi szint: 
                <select id="diffSelect" style="padding: 5px; font-size: 14px;">
                    <option value="easy">1. Egyszerű (ax + b = c)</option>
                    <option value="medium">2. Egyszerű zárójeles (a(x - b) = c)</option>
                    <option value="multi_bracket">3. Haladó többszörös zárójeles</option>
                    <option value="fraction_constant">4. Törtes egyenletek (nagy törtvonallal)</option>
                </select>
            </label>
        </div>

        <div class="equation-box" id="equationText">Egyenlet betöltése...</div>

        <div class="input-container">
            <input type="text" id="userAnswer" placeholder="x = ? (pl. -3 vagy 13/2)" autocomplete="off">
            <br><br>
            <button id="checkBtn">Ellenőrzés</button>
            <button id="nextBtn">Következő feladat</button>
        </div>

        <div class="result" id="resultText"></div>

        <div class="solution-steps" id="solutionSteps">
            <h4>Levezetés lépésről lépésre:</h4>
            <div id="stepsContent"></div>
        </div>

        <div style="margin-top: 20px; font-weight: bold;">
            Helyes: <span id="goodCount">0</span> | Rossz: <span id="badCount">0</span>
        </div>
    </div>

    <!-- Menü betöltése -->
    <script src="../js/menu.js"></script>
    
    <script>
        const equationText = document.getElementById('equationText');
        const userAnswer = document.getElementById('userAnswer');
        const checkBtn = document.getElementById('checkBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resultText = document.getElementById('resultText');
        const diffSelect = document.getElementById('diffSelect');
        const goodCountEl = document.getElementById('goodCount');
        const badCountEl = document.getElementById('badCount');
        const solutionSteps = document.getElementById('solutionSteps');
        const stepsContent = document.getElementById('stepsContent');

        let currentXNum = 0;
        let currentXDenom = 1;
        let currentEqData = {};
        let good = 0;
        let bad = 0;

        function gcd(a, b) {
            return b === 0 ? a : gcd(b, a % b);
        }

        function simplifyFraction(num, denom) {
            if (denom < 0) { num = -num; denom = -denom; }
            let common = gcd(Math.abs(num), denom);
            return { num: num / common, denom: denom / common };
        }

        function generateEquation() {
            userAnswer.value = "";
            userAnswer.disabled = false;
            checkBtn.style.display = "inline-block";
            nextBtn.style.display = "none";
            resultText.textContent = "";
            solutionSteps.style.display = "none";
            userAnswer.focus();

            const diff = diffSelect.value;

            if (diff === 'easy') {
                // 1. Egyszerű: ax + b = c
                let x = Math.floor(Math.random() * 21) - 10;
                let a = Math.floor(Math.random() * 7) + 2;
                let b = Math.floor(Math.random() * 20) - 10;
                let c = a * x + b;

                currentXNum = x;
                currentXDenom = 1;
                currentEqData = { type: 'easy', a, b, c, x };

                let bSign = b >= 0 ? `+ ${b}` : `- ${Math.abs(b)}`;
                equationText.innerHTML = `${a}x ${bSign} = ${c}`;

            } else if (diff === 'medium') {
                // 2. Egyszerű zárójeles: a(x - b) = x + k
                let a = Math.floor(Math.random() * 3) + 2; // 2..4
                let b = Math.floor(Math.random() * 7) - 3; // -3..3
                let x = Math.floor(Math.random() * 10) - 5;
                let rightNum = a * (x - b) - x;

                currentXNum = x;
                currentXDenom = 1;
                currentEqData = { type: 'medium', a, b, rightNum, x };

                let bStr = b >= 0 ? `- ${b}` : `+ ${Math.abs(b)}`;
                let rStr = rightNum >= 0 ? `+ ${rightNum}` : `- ${Math.abs(rightNum)}`;
                equationText.innerHTML = `${a}(x ${bStr}) = x ${rStr}`;

            } else if (diff === 'multi_bracket') {
                // 3. Haladó többszörös zárójeles (pl. 4(x - 3) - 2(2x + 1) = 3x - 5)[cite: 5]
                let a1 = Math.floor(Math.random() * 3) + 2;
                let b1 = Math.floor(Math.random() * 5) + 1;
                let a2 = Math.floor(Math.random() * 2) + 1;
                let a3 = Math.floor(Math.random() * 2) + 1;
                let b2 = Math.floor(Math.random() * 5) + 1;
                let a4 = Math.floor(Math.random() * 3) + 1;
                
                let x = Math.floor(Math.random() * 11) - 5;
                let leftX = a1 - a2 * a3;
                let leftConst = -a1 * b1 - a2 * b2;
                let c = (leftX - a4) * x + leftConst;

                currentXNum = x;
                currentXDenom = 1;
                currentEqData = { type: 'multi', a1, b1, a2, a3, b2, a4, c, x };

                let b1Str = `- ${b1}`;
                let b2Str = `+ ${b2}`;
                let cStr = c >= 0 ? `- ${Math.abs(c)}` : `+ ${Math.abs(c)}`;
                let secondTerm = a3 === 1 ? `(x ${b2Str})` : `(${a3}x ${b2Str})`;
                equationText.innerHTML = `${a1}(x ${b1Str}) - ${a2}${secondTerm} = ${a4 === 1 ? 'x' : a4 + 'x'} ${cStr}`;

            } else {
                // 4. Törtes egyenlet nagy törtvonallal (pl. (2x - 3) / 4 = (x + 1) / 3)[cite: 5]
                let denom1 = [2, 3, 4][Math.floor(Math.random() * 3)];
                let denom2 = [2, 3, 4][Math.floor(Math.random() * 3)];
                if (denom1 === denom2) denom2 = (denom1 === 3) ? 2 : 3;

                let a1 = Math.floor(Math.random() * 3) + 1;
                let b1 = Math.floor(Math.random() * 8) - 4;
                let a2 = Math.floor(Math.random() * 3) + 1;
                let b2 = Math.floor(Math.random() * 8) - 4;

                let leftCoeff = denom2 * a1 - denom1 * a2;
                if (leftCoeff === 0) leftCoeff = 1;
                let rightConst = denom1 * b2 - denom2 * b1;

                let res = simplifyFraction(rightConst, leftCoeff);
                currentXNum = res.num;
                currentXDenom = res.denom;
                currentEqData = { type: 'fraction', a1, b1, denom1, a2, b2, denom2, xNum: currentXNum, xDenom: currentXDenom };

                let b1Str = b1 >= 0 ? `+ ${b1}` : `- ${Math.abs(b1)}`;
                let b2Str = b2 >= 0 ? `+ ${b2}` : `- ${Math.abs(b2)}`;

                // HTML felépítés nagy törtvonallal
                equationText.innerHTML = `
                    <span class="fraction">
                        <span class="numerator">${a1}x ${b1Str}</span>
                        <span class="denominator">${denom1}</span>
                    </span>
                    =
                    <span class="fraction">
                        <span class="numerator">${a2}x ${b2Str}</span>
                        <span class="denominator">${denom2}</span>
                    </span>
                `;
            }
        }

        function showSolution() {
            let html = "";
            let { type, x } = currentEqData;
            if (type === 'easy') {
                html = `1. Átisszük a konstanst a jobb oldalra.<br>2. Osztunk az együtthatóval: <b>x = ${currentEqData.x}</b>`;
            } else if (type === 'medium') {
                html = `1. Felbontjuk a zárójelet.<br>2. Az x-es tagokat balra, a számokat jobbra rendezzük.<br>3. <b>x = ${currentEqData.x}</b>`;
            } else if (type === 'multi') {
                html = `1. Felbontjuk a zárójeleket.<br>2. Összevonjuk az azonos tagokat.<br>3. <b>x = ${currentEqData.x}</b>`;
            } else {
                let exactStr = currentXDenom === 1 ? `${currentXNum}` : `${currentXNum}/${currentXDenom}`;
                html = `1. Keresztszorzással (vagy a közös nevezővel való felszorzással) eltüntetjük a nevezőket.<br>2. Rendezzük az egyenletet.<br>3. <b>x = ${exactStr}</b>`;
            }
            stepsContent.innerHTML = html;
            solutionSteps.style.display = "block";
        }

        function checkAnswer() {
            let rawInput = userAnswer.value.trim().replace(',', '.');
            if (!rawInput) {
                resultText.textContent = "Kérlek írj be egy választ!";
                resultText.className = "result incorrect";
                return;
            }

            let userNum, userDenom;
            if (rawInput.includes('/')) {
                let parts = rawInput.split('/');
                userNum = parseFloat(parts[0]);
                userDenom = parseFloat(parts[1]);
            } else {
                userNum = parseFloat(rawInput);
                userDenom = 1;
            }

            if (isNaN(userNum) || isNaN(userDenom) || userDenom === 0) {
                resultText.textContent = "Helytelen formátum! Használj egész számot vagy törtet (pl. 13/2).";
                resultText.className = "result incorrect";
                return;
            }

            userAnswer.disabled = true;
            checkBtn.style.display = "none";
            nextBtn.style.display = "inline-block";

            let isEqual = Math.abs((userNum / userDenom) - (currentXNum / currentXDenom)) < 0.0001;
            let exactAnswerStr = currentXDenom === 1 ? `${currentXNum}` : `${currentXNum}/${currentXDenom}`;

            if (isEqual) {
                good++;
                goodCountEl.textContent = good;
                resultText.textContent = "Helyes! 🎉 Kiváló teljesítmény!";
                resultText.className = "result correct";
            } else {
                bad++;
                badCountEl.textContent = bad;
                resultText.textContent = `Helytelen! A helyes válasz: x = ${exactAnswerStr}`;
                resultText.className = "result incorrect";
                showSolution();
            }
        }

        checkBtn.addEventListener('click', checkAnswer);
        userAnswer.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkAnswer();
        });
        nextBtn.addEventListener('click', generateEquation);
        diffSelect.addEventListener('change', generateEquation);

        generateEquation();
    </script>
</body>
</html>
