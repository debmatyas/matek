<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Törtek Gyakorló és Aloldalak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .main-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }

        .main-menu a {
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .main-menu a:hover {
            background-color: #e2e6ea;
            color: #007bff;
        }

        .main-menu a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        .sub-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .sub-menu a {
            text-decoration: none;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: bold;
            color: #007bff;
            background-color: #e7f5ff;
            border: 1px solid #b3d7ff;
            border-radius: 6px;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sub-menu a:hover {
            background-color: #d0ebff;
            border-color: #74c0fc;
        }

        .sub-menu a::after {
            content: '➔';
            font-size: 14px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        p {
            color: #6c757d;
            font-size: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <div class="card">
        <!-- Főmenü (html mappán belüli linkekkel) -->
        <div id="main-menu-container"></div>


        <h2>Törtek Gyakorló Főmenü</h2>
        <p>Válassz az alábbi aloldalak közül a gyakorláshoz:</p>

        <!-- Almenü (html mappán belüli linkekkel, szorzotabla nélkül) -->
        <div class="sub-menu">
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/kozos_nevezo.html">Közös nevező</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/muveletek.html">Műveletek</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/osztoja.html">Osztója</a>
        </div>
    </div>
    <script src="../js/menu.js"></script>

</body>

</html>
