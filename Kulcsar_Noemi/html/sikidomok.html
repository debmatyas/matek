<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Síkidom Gyakorló és Számítások</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 560px;
            text-align: center;
        }
        /* Főmenü stílusa */
        .main-menu {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 15px;
        }
        .main-menu a {
            text-decoration: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            color: #495057;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 5px;
            transition: all 0.2s;
        }
        .main-menu a:hover {
            background-color: #e2e6ea;
            color: #007bff;
        }
        .main-menu a.active {
            background-color: #007bff;
            color: white;
            border-color: #007bff;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }
        .mode-selector {
            margin-bottom: 20px;
        }
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ced4da;
            background-color: #fff;
            cursor: pointer;
        }
        .image-box {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            height: 180px;
            align-items: center;
            background: #fff;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            overflow: hidden;
        }
        #shapeImage {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .question-text {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #495057;
            line-height: 1.5;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            padding: 12px 8px;
            font-size: 16px;
            background-color: #f8f9fa;
            border: 1px solid #ced4da;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #e2e6ea;
            border-color: #adb5bd;
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724;
            font-weight: bold;
        }
        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24;
        }

        /* Számolós mód beviteli mezői */
        .calc-input-container {
            margin-bottom: 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
        }
        .calc-input {
            padding: 10px;
            font-size: 16px;
            width: 130px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            text-align: center;
        }
        .calc-unit-select {
            padding: 10px;
            font-size: 16px;
            width: 90px;
            border: 1px solid #ced4da;
            border-radius: 5px;
            background-color: #fff;
            cursor: pointer;
        }
        .calc-submit {
            padding: 10px 16px;
            font-size: 16px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .calc-submit:hover {
            background-color: #218838;
        }

        #next-btn {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        #next-btn:hover {
            background-color: #0056b3;
        }
        #score-container {
            font-size: 16px;
            font-weight: bold;
            color: #333;
            margin-top: 15px;
        }
        
        /* Képlet gyűjtemény stílusa */
        .formula-list {
            display: none;
            text-align: left;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 10px;
            background-color: #f8f9fa;
        }
        .formula-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #dee2e6;
        }
        .formula-item:last-child {
            border-bottom: none;
        }
        .formula-name {
            font-weight: bold;
            color: #495057;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Főmenü -->
        <div class="main-menu">
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/sikidomok.html" class="active">Síkidomok</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/atvaltas.html">Mértékegység átváltás</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/tortek.html">Törtek</a>
            <a href="https://debmatyas.github.io/matek/Kulcsar_Noemi/html/kviz.html">Elméleti Kvíz</a>
        </div>

        <h2>Síkidom Gyakorló</h2>
        
        <div class="mode-selector">
            <select id="modeSelect">
                <option value="recognition">Síkidomfelismerés</option>
                <option value="area_quiz">Terület képlet választás (Kvíz)</option>
                <option value="calculation">Területszámítás (Számolós feladatok)</option>
                <option value="formula_guide">Területképletek gyűjteménye</option>
            </select>
        </div>
        
        <!-- Kvíz / Számolós nézet -->
        <div id="quiz-container">
            <div class="image-box">
                <img id="shapeImage" src="" alt="Síkidom">
            </div>
            
            <p id="questionText" class="question-text"></p>
            
            <!-- Kvíz gombok -->
            <div id="options-container" class="options-grid"></div>

            <!-- Számolós beviteli mező és mértékegység választó -->
            <div id="calc-container" class="calc-input-container" style="display: none;">
                <input type="number" id="calcInput" class="calc-input" placeholder="Érték..." step="any" autocomplete="off">
                <select id="calcUnitSelect" class="calc-unit-select">
                    <option value="0.01">mm²</option>
                    <option value="1" selected>cm²</option>
                    <option value="100">dm²</option>
                    <option value="10000">m²</option>
                </select>
                <button id="calcSubmitBtn" class="calc-submit">Ellenőrzés</button>
            </div>
        </div>

        <!-- Képlet gyűjtemény nézet -->
        <div id="formula-container" class="formula-list"></div>

        <div id="score-container">
            Pontszám: <span id="score">0</span> / <span id="total">0</span>
        </div>
        
        <button id="next-btn" style="display:none;">Következő feladat</button>
    </div>

    <script src="../js/sikidomok.js"></script>
</body>
</html>
